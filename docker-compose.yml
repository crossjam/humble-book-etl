services:
  api:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: humble-api
    restart: unless-stopped
    environment:
      DB_DB_TYPE: sqlite
      DB_DB_PATH: /data/humble_bundle.db
    ports:
      - "5002:5002"
    volumes:
      - ./data:/data
      - ./images:/app/images

  frontend:
    env_file:
      - .env
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5002}
    container_name: humble-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:3002"
    depends_on:
      - api

volumes: {}

